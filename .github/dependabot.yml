version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/v2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.FeatureManagement"
      test-dependencies:
        patterns:
          - "NUnit*"
          - "Moq"
          - "FluentAssertions"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
