# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Text File Generator Build

on: # Uncomment the push trigger and adjust branches/paths once release/v2.16 is merged to main
  push:
    branches: [ "main" ]
    paths:
      - "src/v2/**"
  pull_request: 
    branches:
      - release/* # revert this to main once release/v2.16 is merged
    paths:
      - "src/v2/**"
  workflow_dispatch:
    
env:
  VERSION: 2.16.${{ github.run_number }}
  SOLUTION: src/UTMO.Text.FileGenerator.slnx

jobs:
  build:

    runs-on: windows-latest #OnPremRunners

    steps:
    - uses: actions/checkout@v6
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: src/global.json
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}

    - name: NuGet vulnerability audit
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $auditReportPath = "nuget-vulnerability-audit.txt"
        $scriptPath = Join-Path "${{ github.workspace }}" "scripts/check-vulnerabilities.ps1"
        & $scriptPath "${{ env.SOLUTION }}" *>&1 | Tee-Object -FilePath $auditReportPath
      
    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --no-restore
      
    - name: Test
      run: dotnet test ${{ env.SOLUTION }} --no-build --verbosity normal
      
    - name: Package
      run: dotnet pack ${{ env.SOLUTION }} -c Release -o '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish' /p:PackageVersion='${{ env.VERSION }}'
    
    - name: Publish Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: published-app
        path: '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish'

    - name: Publish NuGet Audit Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nuget-vulnerability-audit
        path: nuget-vulnerability-audit.txt

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: write

    runs-on: ubuntu-latest #OnPremRunners

    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        name: published-app
        path: '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish'

    - name: Configure Nuget Push Target
      run: dotnet nuget add source --name PHX2 "https://packages.public.utmonline.net/nuget/TextFileGeneration/v3/index.json"

    - name: Push to Nuget
      run: dotnet nuget push '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish/*.nupkg' --source PHX2 --skip-duplicate --api-key ${{ secrets.PACKAGES_PUSH_SECRET }}

    - name: Publish Package Metadata
      run: |
        for package in ${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish/*.nupkg; do
          package_name=$(basename "$package" .nupkg)
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/metadata \
            -d "{\"name\":\"$package_name\",\"version\":\"${{ env.VERSION }}\",\"repository\":\"https://packages.public.utmonline.net/nuget/TextFileGeneration/\",\"package_type\":\"nuget\",\"created_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
        done

    - name: Create GitHub Release
      run: gh release create v${{ env.VERSION }} --repo ${{ github.repository }} --title "Release ${{ env.VERSION }}" --generate-notes --prerelease
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
