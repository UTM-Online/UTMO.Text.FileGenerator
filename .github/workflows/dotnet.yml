# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Text File Generator Build

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
  pull_request: 
    branches:
      - "main"
    paths:
      - "src/**"
  workflow_dispatch:
    
env:
  SOLUTION: src/UTMO.Text.FileGenerator.slnx

jobs:
  build:

    runs-on: windows-latest #OnPremRunners

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
      
    - name: Calculate Semantic Version
      uses: mathieudutour/github-tag-action@v6.1
      id: version
      with:
        tag_prefix: "v"
        default_bump: patch
        release_branches: main
        pre_release_branches: ""
        dry_run: true
        github_token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set Version Environment Variable
      shell: pwsh
      run: |
        $newTag = "${{ steps.version.outputs.new_tag }}"
        # Keep only the SemVer core so branch-derived prerelease text is not used in NuGet versions.
        $rawVersion = $newTag -replace '^v', ''
        $rawVersion = $rawVersion.Trim()
        $regex = [Regex]::New('^\d+\.\d+\.\d+')
        if ($regex.IsMatch($rawVersion)) {
          $version = $regex.Match($rawVersion).Value
        }
        else {
          throw "Unable to parse semantic version from tag '$newTag'"
        }
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Calculated version: $version"
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: src/global.json
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}

    - name: NuGet vulnerability audit
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $auditReportPath = "nuget-vulnerability-audit.txt"
        $scriptPath = Join-Path "${{ github.workspace }}" "scripts/check-vulnerabilities.ps1"
        & $scriptPath "${{ env.SOLUTION }}" *>&1 | Tee-Object -FilePath $auditReportPath
      
    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --no-restore
      
    - name: Test
      run: dotnet test ${{ env.SOLUTION }} --no-build --verbosity normal

    - name: Set Package Version
      shell: pwsh
      run: |
        $suffix = if ('${{ github.ref }}' -eq 'refs/heads/main') { '' } else { "-preview.${{ github.run_number }}" }
        $packageVersion = "${{ env.VERSION }}$suffix"
        echo "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      
    - name: Package
      run: dotnet pack ${{ env.SOLUTION }} -c Release -o '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish' /p:PackageVersion='${{ env.PACKAGE_VERSION }}'
    
    - name: Publish Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: published-app
        path: '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish'

    - name: Publish NuGet Audit Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nuget-vulnerability-audit
        path: nuget-vulnerability-audit.txt

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    runs-on: ubuntu-latest #OnPremRunners

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v8
      with:
        name: published-app
        path: '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish'

    - name: Calculate Semantic Version
      uses: mathieudutour/github-tag-action@v6.1
      id: version
      with:
        tag_prefix: "v"
        default_bump: patch
        release_branches: main
        pre_release_branches: ""
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set Package Version
      shell: pwsh
      run: |
        $newTag = "${{ steps.version.outputs.new_tag }}"
        # Keep only the SemVer core so branch-derived prerelease text is not used in NuGet versions.
        $rawVersion = $newTag -replace '^v', ''
        $rawVersion = $rawVersion.Trim()
        $regex = [Regex]::New('^\d+\.\d+\.\d+')
        if ($regex.IsMatch($rawVersion)) {
          $version = $regex.Match($rawVersion).Value
        }
        else {
          throw "Unable to parse semantic version from tag '$newTag'"
        }
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Calculated version: $version"

    - name: Configure Nuget Push Target
      run: dotnet nuget add source --name PHX2 "https://packages.public.utmonline.net/nuget/TextFileGeneration/v3/index.json"

    - name: Push to Nuget
      run: dotnet nuget push '${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish/*.nupkg' --source PHX2 --skip-duplicate --api-key ${{ secrets.PACKAGES_PUSH_SECRET }}

    - name: Publish Package Metadata
      run: |
        for package in ${{ github.workspace }}/src/UTMO.Text.FileGenerator/publish/*.nupkg; do
          package_name=$(basename "$package" .nupkg)
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/metadata \
            -d "{\"name\":\"$package_name\",\"version\":\"${{ env.VERSION }}\",\"repository\":\"https://packages.public.utmonline.net/nuget/TextFileGeneration/\",\"package_type\":\"nuget\",\"created_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
        done

    - name: Create GitHub Release
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          RELEASE_FLAG="--latest"
        else
          RELEASE_FLAG="--prerelease"
        fi
        gh release create v${{ env.PACKAGE_VERSION }} --repo ${{ github.repository }} --title "Release ${{ env.PACKAGE_VERSION }}" --generate-notes $RELEASE_FLAG 2>/dev/null || echo "Release already exists or tag missing"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


